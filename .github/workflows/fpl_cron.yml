name: FPL Weekly Recommendation & Sync

on:
  schedule:
    # Jalan tiap hari jam 06:00 UTC (13:00 WIB) & jam 17:00 UTC (00:00 WIB)
    - cron: '0 6,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-fpl-assistant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync

      - name: Run Snapshot & Update State
        env:
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID || '5938868' }}
          FPL_LEAGUE_ID: ${{ secrets.FPL_LEAGUE_ID || '1190246' }}
        run: |
          uv run fpl-assistant snapshot

      - name: Generate Recommendation & Send Telegram
        env:
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID || '5938868' }}
          FPL_LEAGUE_ID: ${{ secrets.FPL_LEAGUE_ID || '1190246' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          uv run fpl-assistant recommend --notify

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update FPL state & recommendations [skip ci]" && git push)
