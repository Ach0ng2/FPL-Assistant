[project]
name = "fpl-assistant"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "highspy>=1.15.1",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pulp>=4.2.0",
    "pydantic>=2.14.2",
    "rich>=15.0.0",
    "scipy>=1.18.1",
]

[project.scripts]
fpl-assistant = "fpl_assistant:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
]
